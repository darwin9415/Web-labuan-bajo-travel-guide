['🐠',['Diving','Menyelam'],['Batu Bolong and Manta Point are known for strong currents and big marine life. Choose an operator before you pick a hotel.','Batu Bolong dan Manta Point dikenal berarus kuat dan satwa laut besar. Pilih operator diving sebelum memilih hotel.']]];
let L='en',cat='all',q='';const t=k=>T[L][k];
function img(n){return `<img src="assets/img/${n}.jpg" alt="" loading="lazy" onerror="this.remove()">`}
function render(){
 document.documentElement.lang=L;$('#lang').textContent=L==='en'?'ID':'EN';
 $$('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));$$('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
 $('#cat').innerHTML=['all','hotel','resto','car','dive'].map(c=>`<option value="${c}"${c===cat?' selected':''}>${c==='all'?t('all'):t('cats')[c]}</option>`).join('');
 $('#chips').innerHTML=['all','hotel','resto','car','dive'].map(c=>`<button class="chip" data-c="${c}" aria-pressed="${c===cat}">${c==='all'?t('all'):t('cats')[c]}</button>`).join('');
 $('#destGrid').innerHTML=DEST.map((d,i)=>`<button class="card" data-d="${i}"><div class="ph" style="--g:linear-gradient(135deg,#0b3c5d,#1fb6c1)">${d[4]}${img(d[0])}</div><div class="cb"><small>${d[2]}</small><h3>${d[1]}</h3><p>${d[3][L==='en'?0:1]}</p></div></button>`).join('');
 const list=D.filter(x=>(cat==='all'||x.c===cat)&&(x.n+' '+x.a+' '+x.d[0]+' '+x.d[1]).toLowerCase().includes(q));
 $('#count').textContent=list.length;
 $('#bizGrid').innerHTML=list.length?list.map(x=>`<button class="card" data-b="${x.id}"><div class="ph" style="--g:${GR[x.c]}">${IC[x.c]}${x.r?`<span class="rate">★ ${x.r}</span>`:''}</div><div class="cb"><small>${x.a}</small><h3>${x.n}</h3><p>${x.d[L==='en'?0:1]}</p></div></button>`).join(''):`<p>${t('none')}</p>`;
 $('#infoGrid').innerHTML=INFO.map(i=>`<div class="card"><h3>${i[0]} ${i[1][L==='en'?0:1]}</h3><p>${i[2][L==='en'?0:1]}</p></div>`).join('');
}
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),3500)}
let cur=null;
function open(o,form){cur=o;$('#mHead').textContent=o.ic;$('#mHead').style.background=o.g;$('#mTitle').textContent=o.n;$('#mLoc').textContent=o.a;$('#mText').textContent=o.d;
 $('#mMeta').textContent=o.m||'';$('#bookForm').hidden=!form;$('#modal').showModal()}
const pick=i=>{const x=D[i];open({n:x.n,a:x.a,d:x.d[L==='en'?0:1],ic:IC[x.c],g:GR[x.c],m:`${t('src')}: ${x.s}${x.r?` · ★ ${x.r} ${t('rating')}`:''}`},1)};
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-b]'),d=e.target.closest('[data-d]'),c=e.target.closest('[data-c]'),n=e.target.closest('[data-cat]'),p=e.target.closest('[data-pg]');
 if(b)pick(+b.dataset.b);
 if(d){const x=DEST[+d.dataset.d];open({n:x[1],a:x[2],d:x[3][L==='en'?0:1],ic:x[4],g:GR.hotel},1)}
 if(c){cat=c.dataset.c;render()}
 if(n){cat=n.dataset.cat;render();$('#menu').classList.remove('open')}
 if(p){e.preventDefault();open({n:t(p.dataset.pg),a:'',d:t(p.dataset.pg==='privacy'?'pPriv':'pTerms'),ic:'⚓',g:GR.hotel},0)}
});
$('#fContact').href=`https://wa.me/${WA}`;$('#fContact').target='_blank';$('#fContact').rel='noopener';
$('#burger').onclick=()=>{const o=$('#menu').classList.toggle('open');$('#burger').setAttribute('aria-expanded',o)};
$$('#menu a').forEach(a=>a.addEventListener('click',()=>$('#menu').classList.remove('open')));
$('#lang').onclick=()=>{L=L==='en'?'id':'en';render()};
$('#login').onclick=()=>toast(t('soon'));
$('#mClose').onclick=()=>$('#modal').close();
$('#searchForm').onsubmit=e=>{e.preventDefault();q=$('#q').value.trim().toLowerCase();cat=$('#cat').value;render();$('#businesses').scrollIntoView()};
$('#fDate').min=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
$('#bookForm').onsubmit=e=>{e.preventDefault();
 if($('#fDate').value<$('#fDate').min){toast(t('pastDate'));return}
 const m=`${t('hi')} ${cur.n} (${cur.a})\n${$('#fName').value.trim()}\n${t('date')}: ${$('#fDate').value}\n${t('ppl')}: ${$('#fPeople').value}\n${t('nts')}: ${$('#fNotes').value.trim()||'-'}`;
 window.open(`https://wa.me/${WA}?text=${encodeURIComponent(m)}`,'_blank','noopener');$('#modal').close();e.target.reset()};
render();
</script>
</body>
</html>
