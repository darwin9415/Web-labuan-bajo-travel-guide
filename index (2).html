<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bajo Travel Guide — Labuan Bajo, Flores</title>
<meta name="description" content="Panduan premium Labuan Bajo: hotel dari budget hingga premium, paket trip Komodo, restoran, transportasi, dan diving.">
<meta name="theme-color" content="#071d2f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⚓%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#071d2f;--ocean:#0b3c5d;--teal:#1fb6c1;--gold:#c9a45c;--gold-d:#a8833e;--cream:#f6f1e7;--ink:#0f2230;--mut:#5b6b78;--line:#e6dfd0;--wh:#fff;--serif:'Fraunces',Georgia,'Times New Roman',serif;--sans:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{font-family:var(--sans);font-size:16px;line-height:1.65;color:var(--ink);background:var(--wh);-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;line-height:1.1}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
section{padding:112px 0}
.alt{background:var(--cream)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-d)}
.sec-head{display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:end;margin-bottom:56px}
.sec-head h2{font-size:clamp(34px,4.4vw,56px);color:var(--navy);margin-top:12px}
.sec-head p{color:var(--mut);max-width:500px;justify-self:end;font-size:17px}
@media(max-width:860px){.sec-head{grid-template-columns:1fr;gap:20px}.sec-head p{justify-self:start}section{padding:84px 0}}

/* header */
.top{position:fixed;top:0;left:0;right:0;z-index:40;transition:background .35s,box-shadow .35s}
.top.solid{background:rgba(7,29,47,.94);backdrop-filter:blur(10px);box-shadow:0 1px 0 rgba(255,255,255,.08)}
.top-in{display:flex;align-items:center;justify-content:space-between;height:76px}
.logo{font-family:var(--serif);font-size:20px;font-weight:600;color:#fff;text-decoration:none;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.logo i{font-style:normal;color:var(--gold)}
.menu{display:flex;align-items:center;gap:28px}
.menu a{color:rgba(255,255,255,.82);text-decoration:none;font-size:14px;font-weight:500;transition:color .2s}
.menu a:hover{color:var(--gold)}
.right-nav{display:flex;align-items:center;gap:12px}
.lang{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:7px 14px;font:600 12px var(--sans);letter-spacing:.1em;cursor:pointer}
.lang:hover{border-color:var(--gold);color:var(--gold)}
.burger{display:none;background:none;border:0;color:#fff;font-size:24px;cursor:pointer}
@media(max-width:960px){.menu{display:none}.menu.open{display:flex;position:absolute;top:76px;left:0;right:0;flex-direction:column;align-items:flex-start;gap:0;background:var(--navy);padding:12px 24px 22px}.menu.open a{padding:12px 0;width:100%;border-bottom:1px solid rgba(255,255,255,.08)}.burger{display:block}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 26px;border-radius:999px;font:700 14px var(--sans);text-decoration:none;border:1px solid transparent;cursor:pointer;transition:transform .2s,background .2s,color .2s,border-color .2s}
.btn:hover{transform:translateY(-1px)}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-gold:hover{background:#d6b06a}
.btn-line{color:#fff;border-color:rgba(255,255,255,.45);background:transparent}
.btn-line:hover{border-color:var(--gold);color:var(--gold)}
.btn-dark{background:var(--navy);color:#fff}
.btn-dark:hover{background:var(--ocean)}
.btn-sm{padding:10px 18px;font-size:13px}

/* hero */
.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;align-items:flex-end;color:#fff;background:linear-gradient(180deg,#0b3c5d,#071d2f);background-size:cover;background-position:center}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,29,47,.35) 0%,rgba(7,29,47,.55) 45%,rgba(7,29,47,.95) 100%)}
.hero-in{position:relative;padding-top:160px;width:100%}
.hero h1{font-size:clamp(52px,8.4vw,116px);line-height:.98;letter-spacing:-.025em;max-width:960px;margin:16px 0 24px}
.hero h1 em{font-style:italic;color:var(--gold)}
.hero p.lead{font-size:clamp(17px,1.8vw,20px);max-width:600px;color:rgba(255,255,255,.86);margin-bottom:36px}
.hero-cta{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:64px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid rgba(255,255,255,.18);padding:28px 0 40px}
.stat b{display:block;font-family:var(--serif);font-size:clamp(28px,3.4vw,42px);font-weight:500;color:#fff}
.stat span{font-size:13px;color:rgba(255,255,255,.7)}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr);gap:22px}}

/* cards */
.card{position:relative;background:var(--wh);border:1px solid var(--line);border-radius:20px;overflow:hidden;transition:transform .35s,box-shadow .35s,border-color .35s;display:flex;flex-direction:column;text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%}
.card:hover{transform:translateY(-4px);box-shadow:0 26px 44px -26px rgba(7,29,47,.45);border-color:#d8cfbb}
.media{position:relative;aspect-ratio:4/3;overflow:hidden;display:grid;place-items:center;background:linear-gradient(135deg,#0b3c5d,#1fb6c1)}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.card:hover .media img{transform:scale(1.06)}
.media .ico{font-size:52px;opacity:.9;filter:drop-shadow(0 4px 12px rgba(0,0,0,.25))}
.body{padding:22px 24px 26px;display:flex;flex-direction:column;gap:6px;flex:1}
.body small{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
.body h3{font-size:22px;color:var(--navy)}
.body p{font-size:14.5px;color:var(--mut);line-height:1.6}
.rate{position:absolute;top:14px;right:14px;z-index:2;background:rgba(255,255,255,.96);color:var(--navy);font:700 12px var(--sans);padding:5px 11px;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:26px}
.num{font-family:var(--serif);font-size:15px;color:var(--gold-d);font-style:italic}

/* destinations */
.dest .body{gap:4px}
.dest-feature{grid-column:span 2}
.dest-feature .media{aspect-ratio:auto;min-height:100%}

/* trips */
.trip{padding:30px;gap:0}
.trip .tag{display:inline-block;font:700 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--gold-d);margin-bottom:12px}
.trip h3{font-size:26px;color:var(--navy);margin-bottom:6px}
.trip .dur{font-size:14px;color:var(--mut);margin-bottom:22px}
.price{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 0;margin-bottom:20px}
.price strong{display:block;font-family:var(--serif);font-size:30px;font-weight:600;color:var(--navy);line-height:1.1}
.price small{font-size:13px;color:var(--mut)}
.trip ul{list-style:none;display:grid;gap:10px;margin-bottom:18px}
.trip li{position:relative;padding-left:24px;font-size:14.5px;color:#27394a}
.trip li::before{content:"";position:absolute;left:0;top:.6em;width:12px;height:1px;background:var(--gold)}
.trip .note{font-size:13px;color:var(--mut);margin-bottom:24px;flex:1}
.trip .btn{align-self:flex-start}
.itin{margin-top:64px;background:var(--navy);color:#fff;border-radius:28px;padding:56px 48px;position:relative;overflow:hidden}
.itin h3{font-size:clamp(28px,3vw,38px);margin:10px 0 10px}
.itin > p{color:rgba(255,255,255,.7);max-width:620px;margin-bottom:36px}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid rgba(255,255,255,.15)}
.day{padding:28px 28px 0 0}
.day+.day{padding-left:28px;border-left:1px solid rgba(255,255,255,.12)}
.day .d{font-family:var(--serif);font-size:40px;color:var(--gold);line-height:1;margin-bottom:12px}
.day h4{font-family:var(--sans);font-weight:700;font-size:17px;margin-bottom:8px}
.day p{color:rgba(255,255,255,.72);font-size:14.5px}
.itin small{display:block;margin-top:32px;color:rgba(255,255,255,.5);font-size:12.5px}
@media(max-width:860px){.days{grid-template-columns:1fr}.day,.day+.day{padding:24px 0;border-left:0;border-bottom:1px solid rgba(255,255,255,.12)}.itin{padding:40px 26px}}

/* stay */
.stay-split{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start;margin-bottom:72px}
@media(max-width:900px){.stay-split{grid-template-columns:1fr;gap:36px}}
.stay-split h3{font-size:30px;color:var(--navy);margin:10px 0 8px}
.stay-split > div > p{color:var(--mut);margin-bottom:24px}
.rows{border-top:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:20px 0;border-bottom:1px solid var(--line)}
.row b{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--navy);display:block}
.row small{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);font-weight:700}
.row p{font-size:14px;color:var(--mut);margin-top:4px}
.row .r{text-align:right;flex-shrink:0}
.row strong{display:block;font-family:var(--serif);font-size:19px;color:var(--navy);font-weight:600;margin-top:6px}
.pill{display:inline-block;background:var(--navy);color:#fff;font:700 12px var(--sans);padding:4px 11px;border-radius:999px}
.pill.light{background:#eef5f7;color:var(--ocean)}
.callout{background:var(--cream);border-radius:18px;padding:24px 26px;margin-top:26px;font-size:14.5px;color:#35495a}
.callout b{color:var(--navy)}
.monogram{width:44px;height:44px;border-radius:12px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-family:var(--serif);font-size:20px;flex-shrink:0;margin-right:16px}
.row-wrap{display:flex;align-items:center}

/* directory */
.dir-bar{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center;margin-bottom:36px}
.tabs{display:flex;flex-wrap:wrap;gap:10px}
.tab{border:1px solid var(--line);background:var(--wh);color:var(--navy);padding:10px 20px;border-radius:999px;font:600 14px var(--sans);cursor:pointer;transition:.2s}
.tab:hover{border-color:var(--navy)}
.tab[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.search{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 20px;background:var(--wh);min-width:300px}
.search input{border:0;outline:0;font:inherit;flex:1;background:none;color:var(--ink);padding:8px 0}
.search button{background:var(--navy);color:#fff;border:0;border-radius:999px;padding:10px 18px;font:700 13px var(--sans);cursor:pointer}
.count{font-size:13px;color:var(--mut);margin-bottom:24px}
.empty{color:var(--mut);padding:40px 0}
.note-foot{font-size:12.5px;color:var(--mut);margin-top:40px;max-width:800px}
@media(max-width:700px){.search{min-width:0;width:100%}}

/* info */
.info-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.info{background:var(--wh);border:1px solid var(--line);border-radius:18px;padding:30px 26px}
.info .ic{font-size:26px;margin-bottom:14px}
.info h3{font-size:20px;color:var(--navy);margin-bottom:10px}
.info p{font-size:14.5px;color:var(--mut)}
@media(max-width:1000px){.info-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.info-grid{grid-template-columns:1fr}}

/* cta + footer */
.cta{background:linear-gradient(135deg,#0b3c5d,#071d2f);color:#fff;text-align:center;padding:110px 0}
.cta h2{font-size:clamp(34px,4.6vw,60px);margin:12px 0 16px}
.cta p{color:rgba(255,255,255,.75);max-width:560px;margin:0 auto 34px}
.cta .hero-cta{justify-content:center;margin:0}
footer{background:var(--navy);color:rgba(255,255,255,.7);padding:64px 0 40px;font-size:14px}
.foot-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:40px;margin-bottom:40px}
.foot-grid b{font-family:var(--serif);color:#fff;font-size:22px;font-weight:600}
.foot-grid p{margin-top:10px;max-width:380px}
.foot-grid h4{color:#fff;font:700 12px var(--sans);letter-spacing:.16em;text-transform:uppercase;margin-bottom:14px}
.foot-grid a{display:block;color:rgba(255,255,255,.7);text-decoration:none;margin-bottom:8px}
.foot-grid a:hover{color:var(--gold)}
.foot-bottom{border-top:1px solid rgba(255,255,255,.12);padding-top:24px;font-size:12.5px;color:rgba(255,255,255,.5)}
@media(max-width:760px){.foot-grid{grid-template-columns:1fr}}

/* modal */
dialog{border:0;border-radius:24px;padding:0;width:min(560px,94vw);max-height:92vh;overflow:auto;box-shadow:0 40px 80px -30px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(7,29,47,.7);backdrop-filter:blur(3px)}
.mh{aspect-ratio:16/9;border-radius:0}
.m-body{padding:28px 30px 32px}
.m-body h3{font-size:30px;color:var(--navy);margin:6px 0 2px}
.m-body .loc{color:var(--teal);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.m-body p{color:#2e4253;margin:14px 0}
.m-body .meta{display:block;font-size:13px;color:var(--mut);margin-bottom:22px}
.m-actions{display:flex;flex-wrap:wrap;gap:10px}
.m-close{position:absolute;top:14px;right:14px;z-index:5;background:rgba(255,255,255,.95);border:0;width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer;color:var(--navy)}
dialog form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;border-top:1px solid var(--line);padding-top:20px}
dialog form label{font-size:12px;color:var(--mut);font-weight:600;display:grid;gap:6px}
dialog form input,dialog form textarea{font:inherit;padding:11px 13px;border:1px solid var(--line);border-radius:12px;color:var(--ink);width:100%}
dialog form textarea{grid-column:span 2;resize:vertical}
dialog form .btn{grid-column:span 2}
dialog[data-plain] form{display:none}
@media(max-width:560px){dialog form{grid-template-columns:1fr}dialog form textarea,dialog form .btn{grid-column:auto}}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,140px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:12px;transition:.35s;z-index:60;font-size:14px}
.toast.on{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>
<body>

<header class="top" id="top-bar">
 <div class="wrap top-in">
  <a class="logo" href="#home">⚓ <span>Bajo<i>.</i>Guide</span></a>
  <nav class="menu" id="menu">
   <a href="#destinations" data-i="navDest"></a>
   <a href="#trips" data-i="navTrips"></a>
   <a href="#stay" data-i="navStay"></a>
   <a href="#directory" data-i="navDir"></a>
   <a href="#practical" data-i="navInfo"></a>
  </nav>
  <div class="right-nav">
   <button class="lang" id="lang" aria-label="Language">EN</button>
   <a class="btn btn-gold btn-sm" id="navWa" target="_blank" rel="noopener" href="#" data-i="cta"></a>
   <button class="burger" id="burger" aria-label="Menu" aria-expanded="false">☰</button>
  </div>
 </div>
</header>

<main>
<!-- HERO -->
<section class="hero" id="home" style="padding:0">
 <div class="wrap hero-in">
  <div class="eyebrow" style="color:var(--gold)" data-i="heroEy"></div>
  <h1 data-i="heroT"></h1>
  <p class="lead" data-i="heroS"></p>
  <div class="hero-cta">
   <a class="btn btn-gold" href="#trips" data-i="btnTrips"></a>
   <a class="btn btn-line" href="#stay" data-i="btnStay"></a>
  </div>
  <div class="stats" id="stats"></div>
 </div>
</section>

<!-- DESTINATIONS -->
<section id="destinations">
 <div class="wrap">
  <div class="sec-head">
   <div><div class="eyebrow" data-i="dEy"></div><h2 data-i="dH"></h2></div>
   <p data-i="dP"></p>
  </div>
  <div class="grid" id="destGrid"></div>
 </div>
</section>

<!-- TRIPS -->
<section id="trips" class="alt">
 <div class="wrap">
  <div class="sec-head">
   <div><div class="eyebrow" data-i="tEy"></div><h2 data-i="tH"></h2></div>
   <p data-i="tP"></p>
  </div>
  <div class="grid" id="tripGrid"></div>

  <div class="itin">
   <div class="eyebrow" style="color:var(--gold)" data-i="itEy"></div>
   <h3 data-i="itH"></h3>
   <p data-i="itP"></p>
   <div class="days" id="itin"></div>
   <small data-i="itNote"></small>
  </div>
 </div>
</section>

<!-- STAY -->
<section id="stay">
 <div class="wrap">
  <div class="sec-head">
   <div><div class="eyebrow" data-i="sEy"></div><h2 data-i="sH"></h2></div>
   <p data-i="sP"></p>
  </div>
  <div class="stay-split">
   <div>
    <div class="eyebrow" data-i="budEy"></div>
    <h3 data-i="budH"></h3>
    <p data-i="budP"></p>
    <div class="rows" id="budgetList"></div>
    <div class="callout" data-i="budHostel"></div>
   </div>
   <div>
    <div class="eyebrow" data-i="midEy"></div>
    <h3 data-i="midH"></h3>
    <p data-i="midP"></p>
    <div class="rows" id="midList"></div>
    <div class="callout" data-i="midTip"></div>
   </div>
  </div>
  <div class="eyebrow" data-i="pickEy" style="margin-bottom:24px"></div>
  <div class="grid" id="hotelGrid"></div>
 </div>
</section>

<!-- DIRECTORY -->
<section id="directory" class="alt">
 <div class="wrap">
  <div class="sec-head">
   <div><div class="eyebrow" data-i="dirEy"></div><h2 data-i="dirH"></h2></div>
   <p data-i="dirP"></p>
  </div>
  <div class="dir-bar">
   <div class="tabs" id="dirTabs"></div>
   <form class="search" id="searchForm" role="search">
    <input id="q" type="search" data-ph="dirPh" aria-label="Search">
    <button type="submit" data-i="search"></button>
   </form>
  </div>
  <div class="count"><span data-i="found"></span> <b id="dirCount"></b></div>
  <div class="grid" id="dirGrid"></div>
  <p class="note-foot" data-i="disc"></p>
 </div>
</section>

<!-- PRACTICAL -->
<section id="practical">
 <div class="wrap">
  <div class="sec-head">
   <div><div class="eyebrow" data-i="iEy"></div><h2 data-i="iH"></h2></div>
   <p data-i="iP"></p>
  </div>
  <div class="info-grid" id="infoGrid"></div>
 </div>
</section>

<!-- CTA -->
<section class="cta">
 <div class="wrap">
  <div class="eyebrow" style="color:var(--gold)" data-i="ctaEy"></div>
  <h2 data-i="ctaH"></h2>
  <p data-i="ctaP"></p>
  <div class="hero-cta">
   <a class="btn btn-gold" id="ctaWa" target="_blank" rel="noopener" href="#" data-i="ctaBtn"></a>
   <a class="btn btn-line" href="#trips" data-i="btnTrips"></a>
  </div>
 </div>
</section>
</main>

<footer>
 <div class="wrap">
  <div class="foot-grid">
   <div><b>⚓ Bajo Guide</b><p data-i="footP"></p></div>
   <div><h4 data-i="fNav"></h4><a href="#destinations" data-i="navDest"></a><a href="#trips" data-i="navTrips"></a><a href="#stay" data-i="navStay"></a><a href="#directory" data-i="navDir"></a></div>
   <div><h4 data-i="fInfo"></h4><a href="#practical" data-i="navInfo"></a><a href="IMAGE_CREDITS.csv" data-i="photoCredits"></a><a id="fWa" target="_blank" rel="noopener" href="#" data-i="cta"></a></div>
  </div>
  <div class="foot-bottom" data-i="copy"></div>
 </div>
</footer>

<dialog id="modal">
 <button class="m-close" id="mClose" aria-label="Close">✕</button>

 bookTitle:'Ajukan pemesanan',bName:'Nama',bDate:'Tanggal',bPeople:'Jumlah orang',bNotes:'Catatan',bSend:'Kirim ke WhatsApp',
 cats:{resto:'Restoran',car:'Transportasi',dive:'Diving & Tur',hotel:'Hotel'}}
};

const STATS={en:[['7','Landmarks'],['31','Listings'],['~US$165','3-day trip from, per person'],['1,000','Daily park visitor quota']],
 id:[['7','Destinasi'],['31','Listing'],['~US$165','Trip 3 hari mulai, per orang'],['1.000','Kuota pengunjung taman per hari']]};

const PRAC=[
 ['🎫',[ 'Kuota & izin','Kuota & izin'],[ 'From April 2026 the park caps entry at about 1,000 visitors a day. Book permits early, especially for liveaboards.','Mulai April 2026, taman membatasi sekitar 1.000 pengunjung per hari. Pesan izin lebih awal, terutama untuk liveaboard.']],
 ['💳',[ 'Tiket taman nasional','Tiket taman nasional'],[ 'Sources disagree. Some list IDR 650,000 per person for Komodo and Padar, and IDR 900,000 for the Rinca route. Check the official SiOra platform or your operator before paying.','Sumber berbeda pendapat. Ada yang menyebut IDR 650.000 per orang untuk Komodo dan Padar, dan IDR 900.000 untuk rute Rinca. Cek SiOra resmi atau operator sebelum membayar.']],
 ['🌡️',[ 'Waktu terbaik','Waktu terbaik'],[ 'Dragon sightings can drop in July and August during mating season. Hotels are cheapest in January.','Melihat komodo bisa lebih sulit di Juli dan Agustus saat musim kawin. Hotel paling murah di Januari.']],
 ['🗓️',[ 'Berapa hari','Berapa hari'],[ 'Arrive at least one day before your boat leaves. A 3-day liveaboard needs about 4–5 days in total.','Tiba minimal sehari sebelum kapal berangkat. Untuk liveaboard 3 hari, siapkan 4–5 hari total.']],
 ['🩺',[ 'Kesehatan & keselamatan','Kesehatan & keselamatan'],[ 'Bring reef-safe sunscreen, motion-sickness medicine, a dry bag and a reusable bottle. Tell your guide about medical conditions before sailing.','Bawa tabir surya reef-safe, obat mabuk laut, dry bag, dan botol minum ulang. Sampaikan kondisi medis kepada pemandu sebelum berlayar.']],
 ['💵',[ 'Uang & koneksi','Uang & koneksi'],[ 'Keep cash for small boats, park fees and remote islands. Download offline maps because mobile signal can disappear at sea.','Siapkan uang tunai untuk kapal kecil, tiket taman, dan pulau terpencil. Unduh peta offline karena sinyal bisa hilang di laut.']],
 ['🤝',[ 'Etika berkunjung','Etika berkunjung'],[ 'Stay on marked trails, never feed wildlife, carry your rubbish back and ask before photographing local residents.','Tetap di jalur yang ditandai, jangan memberi makan satwa, bawa kembali sampah, dan minta izin sebelum memotret warga.']]
];

let L='id',cat='resto',q='';
const t=k=>UI[L][k];
const ei=a=>Array.isArray(a)?a[L==='en'?0:1]:a;
const tx=o=>o[L];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug=n=>n.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const wa=m=>`https://wa.me/${WA}?text=${encodeURIComponent(m)}`;
const IC={hotel:'🏨',resto:'🍽️',car:'🚐',dive:'🤿'};
const GR={hotel:'linear-gradient(135deg,#0b3c5d,#2a8fb0)',resto:'linear-gradient(135deg,#7a3e1d,#c98a4b)',car:'linear-gradient(135deg,#1c5a4e,#4fc1a6)',dive:'linear-gradient(135deg,#052a4a,#1fb6c1)'};

function media(key,alt,icon,grad){
 const src=IMG[key];
 return `<div class="media" style="background:${grad||GR.hotel}">${icon?`<span class="ico">${icon}</span>`:''}${src?`<img src="${src}" alt="${esc(alt)}" decoding="async" onerror="this.remove()">`:''}</div>`;
}

function bizCard(x){
 return `<article class="card" data-b="${x.id}" role="button" tabindex="0">
  ${x.r?`<span class="rate">★ ${esc(x.r)}</span>`:''}
  ${media(x.c,x.n,IC[x.c],GR[x.c])}
  <div class="body"><small>${esc(x.a)}</small><h3>${esc(x.n)}</h3><p>${esc(ei(x.d))}</p></div></article>`;
}

function renderStats(){
 $('#stats').innerHTML=STATS[L].map(s=>`<div class="stat"><b>${s[0]}</b><span>${s[1]}</span></div>`).join('');
}

function renderDest(){
 $('#destGrid').innerHTML=DEST.map((d,i)=>`<article class="card" data-d="${i}" role="button" tabindex="0">
  ${media(d[0],d[1],d[4],'linear-gradient(135deg,#0b3c5d,#1fb6c1)')}
  <div class="body"><span class="num">${String(i+1).padStart(2,'0')}</span><small>${esc(d[2])}</small><h3>${esc(d[1])}</h3><p>${esc(ei(d[3]))}</p></div></article>`).join('');
}

function renderTrips(){
 $('#tripGrid').innerHTML=TRIPS.map(x=>`<article class="card trip">
  <span class="tag">${x.tag[L]}</span>
  <h3>${x.n[L]}</h3>
  <div class="dur">${x.dur[L]}</div>
  <div class="price"><strong>${x.price[L]}</strong><small>${x.unit[L]}</small></div>
  <ul>${x.inc[L].map(s=>`<li>${s}</li>`).join('')}</ul>
  <p class="note">${x.note[L]}</p>
  <a class="btn btn-dark btn-sm" target="_blank" rel="noopener" href="${wa(x.q[L])}">${t('askWa')}</a>
 </article>`).join('');
 $('#itin').innerHTML=ITIN.map(x=>`<div class="day"><div class="d">${x.d[L]}</div><h4>${x.t[L]}</h4><p>${x.x[L]}</p></div>`).join('');
}

function renderStay(){
 $('#budgetList').innerHTML=BUDGET.map((b,i)=>`<div class="row"><div class="row-wrap"><span class="monogram">${esc(b.n[0])}</span><div><small>${esc(b.z[L])}</small><b>${esc(b.n)}</b><p>${esc(b.d[L])}</p></div></div>
  <div class="r">${b.r?`<span class="pill light">★ ${esc(b.r)}</span>`:''}<strong>${b.p?b.p[L]:t('askPrice')}</strong></div></div>`).join('');
 $('#midList').innerHTML=MID.map(b=>`<div class="row"><div class="row-wrap"><span class="monogram">${esc(b.n[0])}</span><div><small>${esc(b.z[L])}</small><b>${esc(b.n)}</b><p>${esc(b.d[L])}</p></div></div>
  <div class="r">${b.r?`<span class="pill light">★ ${esc(b.r)}</span>`:''}<strong>${b.p?b.p[L]:t('askPrice')}</strong></div></div>`).join('');
 $('#hotelGrid').innerHTML=D.filter(x=>x.c==='hotel').map(bizCard).join('');
}

function renderDir(){
 $('#dirTabs').innerHTML=['resto','car','dive'].map(c=>`<button class="tab" data-c="${c}" aria-pressed="${c===cat}">${IC[c]} ${UI[L].cats[c]}</button>`).join('');
 const list=D.filter(x=>x.c===cat&&(x.n+' '+x.a+' '+ei(x.d)).toLowerCase().includes(q));
 $('#dirCount').textContent=list.length;
 $('#dirGrid').innerHTML=list.length?list.map(bizCard).join(''):`<p class="empty">${t('none')}</p>`;
}

function renderInfo(){
 const rows=[...INFO,...PRAC];
 $('#infoGrid').innerHTML=rows.map(r=>`<div class="info"><div class="ic">${r[0]}</div><h3>${ei(r[1])}</h3><p>${ei(r[2])}</p></div>`).join('');
}

function renderUI(){
 document.documentElement.lang=L;
 $('#lang').textContent=L==='en'?'ID':'EN';
 $$('[data-i]').forEach(e=>{const v=UI[L][e.dataset.i];if(v!==undefined){if(/<[a-z]/i.test(v))e.innerHTML=v;else e.textContent=v}});
 $$('[data-ph]').forEach(e=>e.placeholder=UI[L][e.dataset.ph]);
 $('#navWa').href=wa(L==='en'?'Hi, I want to ask about Labuan Bajo trips.':'Halo, saya mau tanya soal trip Labuan Bajo.');
 $('#ctaWa').href=$('#navWa').href; $('#fWa').href=$('#navWa').href;
}

function renderAll(){renderUI();$('#home').style.backgroundImage=`url(${IMG.padar})`;renderStats();renderDest();renderTrips();renderStay();renderDir();renderInfo()}

function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),3000)}
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];

let cur=null;
function openModal(o){
 cur=o;
 $('#mHead').outerHTML=media(o.img,o.title,o.icon,o.grad).replace('<div class="media"','<div class="media mh" id="mHead"');
 $('#mTitle').textContent=o.title;
 $('#mLoc').textContent=o.loc||'';
 $('#mText').textContent=o.text||'';
 $('#mMeta').textContent=o.meta||'';
 $('#mWa').href=wa(o.msg);
 $('#mWa').textContent=t('askWa');
 $('#modal').showModal();
}

document.addEventListener('click',e=>{
 const d=e.target.closest('[data-d]'),b=e.target.closest('[data-b]'),c=e.target.closest('[data-c]');
 if(d){const x=DEST[+d.dataset.d];
  openModal({img:x[0],title:x[1],icon:x[4],grad:'linear-gradient(135deg,#0b3c5d,#1fb6c1)',loc:x[2],text:ei(x[3]),meta:'',
   msg:L==='en'?`Hi, I'd like to know more about ${x[1]}.`:`Halo, saya mau tanya soal ${x[1]}.`});return}
 if(b){const x=D[+b.dataset.b];
  openModal({img:x.c,title:x.n,icon:IC[x.c],grad:GR[x.c],loc:x.a,text:ei(x.d),meta:`${ei(['Source','Sumber'])}: ${x.s}${x.r?` · ★ ${x.r} ${t('rating')}`:''}`,
   msg:L==='en'?`Hi, I'd like to ask about ${x.n}.`:`Halo, saya mau tanya soal ${x.n}.`});return}
 if(c){cat=c.dataset.c;renderDir();return}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.matches('[data-d],[data-b]'))){e.target.click()}});

$('#lang').onclick=()=>{L=L==='en'?'id':'en';renderAll()};
$('#burger').onclick=()=>{const o=$('#menu').classList.toggle('open');$('#burger').setAttribute('aria-expanded',o)};
$$('#menu a').forEach(a=>a.addEventListener('click',()=>$('#menu').classList.remove('open')));
$('#mClose').onclick=()=>$('#modal').close();
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').close()});
$('#searchForm').onsubmit=e=>{e.preventDefault();q=$('#q').value.trim().toLowerCase();renderDir();$('#directory').scrollIntoView()};
$('#q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();renderDir()});
window.addEventListener('scroll',()=>$('#top-bar').classList.toggle('solid',scrollY>40),{passive:true});

renderAll();
</script>
</body>
</html>
